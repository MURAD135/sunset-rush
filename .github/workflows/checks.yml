name: Build and simulation checks
on:
  pull_request:
  push:
    branches: ['feat/**', 'fix/**']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package static review build (no deployment)
        run: python3 scripts/package-review.py
      - name: Retain downloadable review package
        uses: actions/upload-artifact@v4
        with:
          name: sunset-rush-3-review-${{ github.sha }}
          path: |
            artifacts/review/*.zip
            artifacts/review/*.sha256
          if-no-files-found: error
          retention-days: 14
# Intentionally no Pages deployment, release, merge or write token permissions.
