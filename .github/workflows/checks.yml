name: Build and simulation checks
on:
  pull_request:
  push:
    branches: ['feat/**', 'fix/**']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
# Intentionally no Pages deployment, release, merge or write token permissions.
